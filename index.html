<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #eef7ff;
      color: #222;
    }

    nav {
      background: #2855d9;
      padding: 15px;
      border-radius: 10px;
    }

    nav a {
      color: white;
      margin: 0 12px;
      font-weight: bold;
      text-decoration: underline;
    }

    h1 {
      color: #3159c9;
      font-size: 28px;
      margin-top: 16px;
    }

    p {
      line-height: 1.6;
    }

    .section {
      padding: 20px;
      margin: 20px 8px;
      border-radius: 15px;
      background: white;
    }

    #about h2 {
      color: #e47765;
    }

    #about .project {
      color: #6c63ff;
    }

    #contact {
      background: #fff0f5;
    }

    #contact h2 {
      color: #d63384;
    }

    button {
      background: #ffb703;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    footer {
      background: #3457d5;
      color: white;
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
    }

    html {
      scroll-behavior: smooth;
    }
  </style>
</head>

<body>

  <nav id="home">
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>

  <h1>Welcome to My Website!</h1>
  <p>Hello! This is my first personal website.</p>

  <div class="section" id="about">
    <h2>About Me</h2>
    <p>I am learning how to create websites.</p>
    <p class="project">This is my first project!</p>

    <button onclick="alert('Thanks for visiting my website! ❤️')">
      Click Me!
    </button>
  </div>

  <div class="section" id="contact">
    <h2>Contact Me</h2>
    <p>You can contact me here!</p>
    <p>Email: hello@example.com</p>
  </div>

  <footer>
    <p>© 2026 My First Website</p>
    <p>Made by a beginner web developer!</p>
  </footer>

</body>
</html>
