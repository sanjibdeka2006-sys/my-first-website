<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #ff758c, #845ec2, #00c9a7);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      padding: 35px 25px;
      margin: 20px;
      border-radius: 20px;
      background: rgba(255,255,255,0.18);
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }
    h1 { font-size: 36px; }
    p { font-size: 18px; line-height: 1.6; }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 25px;
      background: white;
      color: #845ec2;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to My Website! 🎨</h1>
    <p>This is my first colorful website.</p>
    <button onclick="alert('Thanks for visiting! ❤️')">
      Click Me!
    </button>
  </div>
</body>
</html>
